name: E2E Tests

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    name: End-to-End Dashboard Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: skillbridge_e2e
          POSTGRES_USER: skillbridge
          POSTGRES_PASSWORD: e2e_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      
      - name: Setup Node.js 22.22.2
        uses: actions/setup-node@v4
        with:
          node-version: "22.22.2"
          cache: "npm"
          cache-dependency-path: '**/package-lock.json'
      
      - name: Setup Java 25
        uses: actions/setup-java@v4
        with:
          java-version: "25"
          distribution: "temurin"
          cache: "maven"
      
      - name: Grant execute permission to mvnw
        run: chmod +x ./backend/mvnw

      - name: Install dependencies (with retry)
        uses: nick-fields/retry@v3
        with:
          timeout_minutes: 7
          max_attempts: 3
          retry_wait_seconds: 10
          command: npm ci --prefer-offline --no-audit --no-fund

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
        timeout-minutes: 7
      
      - name: Start Backend Server (single JAR with embedded frontend)
        run: |
          cd backend
          ./mvnw -B spring-boot:run -Dspring-boot.run.jvmArguments="-Dserver.port=9095" &
          echo $! > backend.pid
        env:
          DATABASE_URL: jdbc:postgresql://localhost:5432/skillbridge_e2e?sslmode=disable
          DATABASE_USERNAME: skillbridge
          DATABASE_PASSWORD: e2e_password
          JWT_SECRET: ${{ secrets.JWT_SECRET || 'ci_test_secret_that_is_at_least_32_chars_long_for_hs256' }}
          SERVER_PORT: 9095
      
      - name: Start Frontend Dev Server (for E2E, separate from JAR static)
        run: |
          npm run dev &
          echo $! > frontend.pid
        env:
          VITE_API_BASE_URL: http://localhost:9095
      
      - name: Wait for services
        run: |
          npx wait-on http://localhost:9095/actuator/health http://localhost:3000 --timeout 120000
      
      - name: Run Playwright E2E tests
        run: npx playwright test
        env:
          PLAYWRIGHT_BASE_URL: http://localhost:3000
        timeout-minutes: 10
      
      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
