name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Build & Verify Backend
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: skillbridge
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: jdbc:postgresql://localhost:5432/skillbridge?sslmode=disable
      DATABASE_USERNAME: postgres
      DATABASE_PASSWORD: postgres
      FLYWAY_ENABLED: "true"
      JWT_SECRET: ${{ secrets.JWT_SECRET || 'ci_test_secret_that_is_at_least_32_chars_long_for_hs256' }}
      SERVER_PORT: 9095

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Make Maven Wrapper executable
        shell: bash
        run: chmod +x backend/mvnw

      - name: Run Backend Test Suite
        shell: bash
        run: cd backend && ./mvnw -B test

      - name: Package Backend Artifact (single JAR with embedded frontend)
        shell: bash
        run: cd backend && ./mvnw -B package -DskipTests

  frontend:
    name: Build & Verify Frontend
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Node.js 22.19.0
        uses: actions/setup-node@v4
        with:
          node-version: '22.19.0'
          cache: 'npm'
          cache-dependency-path: '**/package-lock.json'

      - name: Install dependencies (with retry)
        uses: nick-fields/retry@v3
        with:
          timeout_minutes: 7
          max_attempts: 3
          retry_wait_seconds: 10
          command: npm ci --prefer-offline --no-audit --no-fund

      - name: Check TypeScript types
        run: npx tsc --noEmit
        timeout-minutes: 5

      - name: Build Frontend project
        run: npm run build
        env:
          VITE_API_BASE_URL: http://localhost:9095
        timeout-minutes: 5
