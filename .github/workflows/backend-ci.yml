name: Backend CI/CD

on:
  push:
    branches: [ main, dev, "feature/**" ]
    paths:
      - "backend/**"
      - ".github/workflows/backend-ci.yml"
  pull_request:
    branches: [ main, dev ]
    paths:
      - "backend/**"

jobs:
  test:
    name: Test & Build (Java 25)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: skillbridge_test
          POSTGRES_USER: skillbridge
          POSTGRES_PASSWORD: test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Java 25
        uses: actions/setup-java@v4
        with:
          java-version: "25"
          distribution: "temurin"
          cache: "maven"
      
      - name: Cache Maven dependencies
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('backend/**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-
      
      - name: Run unit tests
        run: ./mvnw test
        env:
          SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/skillbridge_test
          SPRING_DATASOURCE_USERNAME: skillbridge
          SPRING_DATASOURCE_PASSWORD: test_password
          SPRING_JPA_HIBERNATE_DDL_AUTO: validate
      
      - name: Build JAR
        run: ./mvnw clean package -DskipTests
      
      - name: Upload JAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: backend-jar
          path: backend/target/*.jar
          retention-days: 7

  flyway-validate:
    name: Validate Database Migrations
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: skillbridge_migrate
          POSTGRES_USER: skillbridge
          POSTGRES_PASSWORD: test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Java 25
        uses: actions/setup-java@v4
        with:
          java-version: "25"
          distribution: "temurin"
          cache: "maven"
      
      - name: Run Flyway migrations
        run: ./mvnw flyway:migrate -Dflyway.url=jdbc:postgresql://localhost:5432/skillbridge_migrate -Dflyway.user=skillbridge -Dflyway.password=test_password
      
      - name: Validate migrations (V20, V21, V22)
        run: |
          ./mvnw flyway:info -Dflyway.url=jdbc:postgresql://localhost:5432/skillbridge_migrate -Dflyway.user=skillbridge -Dflyway.password=test_password
          echo "✅ Checking migration files"
