name: CI

on:
  push:
    branches: [ dev, main ]
  pull_request:
    branches: [ dev, main ]

jobs:
  build:
    name: Build and Verify Backend
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: skillbridge
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: jdbc:postgresql://localhost:5432/skillbridge?sslmode=disable
      DATABASE_USERNAME: postgres
      DATABASE_PASSWORD: postgres
      FLYWAY_ENABLED: "true"
      JWT_SECRET: very_secret_default_key_that_should_be_changed_in_prod_and_is_at_least_256_bits_long
      SERVER_PORT: 9095

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Make Maven Wrapper executable
        shell: bash
        run: chmod +x mvnw

      - name: Run Test Suite
        shell: bash
        run: ./mvnw -B test

      - name: Package Executable Artifact
        shell: bash
        run: ./mvnw -B package -DskipTests
