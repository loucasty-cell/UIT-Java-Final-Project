name: Backend CI/CD

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - "src/**"
      - "package.json"
      - "package-lock.json"
      - "vite.config.ts"
      - ".github/workflows/backend-ci.yml"
  pull_request:
    branches: [main]
    paths:
      - "backend/**"
      - "src/**"
      - "package.json"
      - "package-lock.json"
      - "vite.config.ts"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test & Build (Java 25)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: skillbridge_test
          POSTGRES_USER: skillbridge
          POSTGRES_PASSWORD: test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      
      - name: Setup Java 25
        uses: actions/setup-java@v4
        with:
          java-version: "25"
          distribution: "temurin"
          cache: "maven"
      
      - name: Grant execute permission to mvnw
        run: chmod +x ./mvnw
      
      - name: Run unit tests
        run: ./mvnw -B test
        env:
          DATABASE_URL: jdbc:postgresql://localhost:5432/skillbridge_test?sslmode=disable
          DATABASE_USERNAME: skillbridge
          DATABASE_PASSWORD: test_password
          JWT_SECRET: ${{ secrets.JWT_SECRET || 'ci_test_secret_that_is_at_least_32_chars_long_for_hs256' }}
      
      - name: Build JAR (frontend embedded)
        run: ./mvnw -B clean package -DskipTests
        env:
          DATABASE_URL: jdbc:postgresql://localhost:5432/skillbridge_test?sslmode=disable
          DATABASE_USERNAME: skillbridge
          DATABASE_PASSWORD: test_password
          JWT_SECRET: ${{ secrets.JWT_SECRET || 'ci_test_secret_that_is_at_least_32_chars_long_for_hs256' }}
      
      - name: Upload JAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: backend-jar
          path: backend/target/*.jar
          retention-days: 7

  flyway-validate:
    name: Validate Database Migrations
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: backend
    
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: skillbridge_migrate
          POSTGRES_USER: skillbridge
          POSTGRES_PASSWORD: test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      
      - name: Setup Java 25
        uses: actions/setup-java@v4
        with:
          java-version: "25"
          distribution: "temurin"
          cache: "maven"
      
      - name: Grant execute permission to mvnw
        run: chmod +x ./mvnw
      
      - name: Run Flyway migrations
        run: ./mvnw flyway:migrate -Dflyway.url=jdbc:postgresql://localhost:5432/skillbridge_migrate -Dflyway.user=skillbridge -Dflyway.password=test_password
      
      - name: Validate migrations (V20, V21, V22, V23)
        run: |
          ./mvnw flyway:info -Dflyway.url=jdbc:postgresql://localhost:5432/skillbridge_migrate -Dflyway.user=skillbridge -Dflyway.password=test_password
          echo "✅ Checking migration files"
