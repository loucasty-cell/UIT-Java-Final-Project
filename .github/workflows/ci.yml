name: CI

on:
  push:
    branches: [ dev, main ]
  pull_request:
    branches: [ dev, main ]

jobs:
  build:
    name: Build and Verify Backend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Make Maven Wrapper executable
        shell: bash
        run: chmod +x mvnw

      - name: Run Test Suite
        shell: bash
        run: ./mvnw -B test

      - name: Package Executable Artifact
        shell: bash
        run: ./mvnw -B package -DskipTests
