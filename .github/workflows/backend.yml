name: Backend CI/CD

on:
  push:
    branches: [main, develop]
    paths:
      - 'backend/**'
      - 'pom.xml'
      - '.github/workflows/backend.yml'
  pull_request:
    branches: [main, develop]
    paths:
      - 'backend/**'
      - 'pom.xml'

env:
  JAVA_VERSION: '17'
  MAVEN_VERSION: '3.8.1'

jobs:
  build:
    name: Build Backend
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: skillbridge_test
          POSTGRES_USER: skillbridge
          POSTGRES_PASSWORD: skillbridge
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'
          cache: maven
      
      - name: Build with Maven
        run: |
          cd backend
          ./mvnw clean package -DskipTests
      
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: backend-jar
          path: backend/target/*.jar
          retention-days: 5

  test:
    name: Test Backend
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: skillbridge_test
          POSTGRES_USER: skillbridge
          POSTGRES_PASSWORD: skillbridge
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'
          cache: maven
      
      - name: Run Unit Tests
        run: |
          cd backend
          ./mvnw test
        env:
          SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/skillbridge_test
          SPRING_DATASOURCE_USERNAME: skillbridge
          SPRING_DATASOURCE_PASSWORD: skillbridge

  code-quality:
    name: Code Quality Analysis
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'
          cache: maven
      
      - name: Run SonarQube Analysis
        run: |
          cd backend
          ./mvnw clean verify sonar:sonar \
            -Dsonar.projectKey=skillbridge-backend \
            -Dsonar.host.url=${{ secrets.SONAR_HOST_URL }} \
            -Dsonar.login=${{ secrets.SONAR_TOKEN }}
        continue-on-error: true

  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'
          cache: maven
      
      - name: Dependency Check
        run: |
          cd backend
          ./mvnw org.owasp:dependency-check-maven:check
        continue-on-error: true

  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    needs: [build, test]
    if: github.ref == 'refs/heads/develop'
    environment:
      name: staging
      url: https://api-staging.skillbridge.dev
    steps:
      - uses: actions/checkout@v4
      
      - name: Download JAR artifact
        uses: actions/download-artifact@v4
        with:
          name: backend-jar
      
      - name: Deploy to Staging
        run: |
          echo "Deploying backend to staging..."
          # Add your staging deployment command
          # Example: scp *.jar user@staging-server:/app/
        env:
          DEPLOY_KEY: ${{ secrets.DEPLOY_KEY }}
          STAGING_HOST: ${{ secrets.STAGING_HOST }}

  deploy-production:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: [build, test, code-quality, security-scan]
    if: github.ref == 'refs/heads/main'
    environment:
      name: production
      url: https://api.skillbridge.dev
    steps:
      - uses: actions/checkout@v4
      
      - name: Download JAR artifact
        uses: actions/download-artifact@v4
        with:
          name: backend-jar
      
      - name: Deploy to Production
        run: |
          echo "Deploying backend to production..."
          # Add your production deployment command
          # Example: scp *.jar user@prod-server:/app/
        env:
          DEPLOY_KEY: ${{ secrets.DEPLOY_KEY }}
          PRODUCTION_HOST: ${{ secrets.PRODUCTION_HOST }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DATABASE_USERNAME: ${{ secrets.DATABASE_USERNAME }}
          DATABASE_PASSWORD: ${{ secrets.DATABASE_PASSWORD }}
      
      - name: Notify Deployment
        if: success()
        run: echo "Backend deployed successfully to production"

  notify:
    name: Notify on Completion
    runs-on: ubuntu-latest
    needs: [build, test, code-quality, security-scan]
    if: always()
    steps:
      - name: Send notification
        run: echo "Backend CI/CD pipeline completed"
