name: Backend CI/CD

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - 'src/**'
      - 'package.json'
      - 'package-lock.json'
      - 'vite.config.ts'
      - '.github/workflows/backend.yml'
  pull_request:
    branches: [main]
    paths:
      - 'backend/**'
      - 'src/**'
      - 'package.json'
      - 'package-lock.json'
      - 'vite.config.ts'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  JAVA_VERSION: '25'

jobs:
  build:
    name: Build Backend (single JAR)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: skillbridge_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'
          cache: maven
      
      - name: Grant execute permission to mvnw
        run: chmod +x ./backend/mvnw
      
      - name: Build with Maven (frontend embedded)
        run: |
          cd backend
          ./mvnw -B clean package -DskipTests
        env:
          DATABASE_URL: jdbc:postgresql://localhost:5432/skillbridge_test?sslmode=disable
          DATABASE_USERNAME: postgres
          DATABASE_PASSWORD: postgres
          JWT_SECRET: ${{ secrets.JWT_SECRET || 'ci_test_secret_that_is_at_least_32_chars_long_for_hs256' }}
      
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: backend-jar
          path: backend/target/*.jar
          retention-days: 5

  test:
    name: Test Backend
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: skillbridge_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'
          cache: maven
      
      - name: Grant execute permission to mvnw
        run: chmod +x ./backend/mvnw
      
      - name: Run Unit Tests
        run: |
          cd backend
          ./mvnw -B test
        env:
          DATABASE_URL: jdbc:postgresql://localhost:5432/skillbridge_test?sslmode=disable
          DATABASE_USERNAME: postgres
          DATABASE_PASSWORD: postgres
          JWT_SECRET: ${{ secrets.JWT_SECRET || 'ci_test_secret_that_is_at_least_32_chars_long_for_hs256' }}

  code-quality:
    name: Code Quality Analysis
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'
          cache: maven
      
      - name: Grant execute permission to mvnw
        run: chmod +x ./backend/mvnw
      
      - name: Run SonarQube Analysis
        run: |
          cd backend
          ./mvnw clean verify sonar:sonar \
            -Dsonar.projectKey=skillbridge-backend \
            -Dsonar.host.url=${{ secrets.SONAR_HOST_URL }} \
            -Dsonar.login=${{ secrets.SONAR_TOKEN }}
        continue-on-error: true

  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'
          cache: maven
      
      - name: Grant execute permission to mvnw
        run: chmod +x ./backend/mvnw
      
      - name: Dependency Check
        run: |
          cd backend
          ./mvnw org.owasp:dependency-check-maven:check
        continue-on-error: true

  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    needs: [build, test]
    if: false
    environment:
      name: staging
      url: https://api-staging.skillbridge.dev
    steps:
      - uses: actions/checkout@v4
      
      - name: Download JAR artifact
        uses: actions/download-artifact@v4
        with:
          name: backend-jar
      
      - name: Deploy to Staging
        run: |
          echo "Deploying backend to staging..."
        env:
          DEPLOY_KEY: ${{ secrets.DEPLOY_KEY }}
          STAGING_HOST: ${{ secrets.STAGING_HOST }}

  deploy-production:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: [build, test, code-quality, security-scan]
    if: github.ref == 'refs/heads/main'
    environment:
      name: production
      url: https://api.skillbridge.dev
    steps:
      - uses: actions/checkout@v4
      
      - name: Download JAR artifact
        uses: actions/download-artifact@v4
        with:
          name: backend-jar
      
      - name: Deploy to Production
        run: |
          echo "Deploying backend to production..."
        env:
          DEPLOY_KEY: ${{ secrets.DEPLOY_KEY }}
          PRODUCTION_HOST: ${{ secrets.PRODUCTION_HOST }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DATABASE_USERNAME: ${{ secrets.DATABASE_USERNAME }}
          DATABASE_PASSWORD: ${{ secrets.DATABASE_PASSWORD }}
      
      - name: Notify Deployment
        if: success()
        run: echo "Backend deployed successfully to production"

  notify:
    name: Notify on Completion
    runs-on: ubuntu-latest
    needs: [build, test, code-quality, security-scan]
    if: always()
    steps:
      - name: Send notification
        run: echo "Backend CI/CD pipeline completed"
