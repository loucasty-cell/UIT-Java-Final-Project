name: E2E Tests

on:
  pull_request:
    branches: [ main, dev ]
  workflow_dispatch:

jobs:
  e2e:
    name: End-to-End Dashboard Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: skillbridge_e2e
          POSTGRES_USER: skillbridge
          POSTGRES_PASSWORD: e2e_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
      
      - name: Setup Java 25
        uses: actions/setup-java@v4
        with:
          java-version: "25"
          distribution: "temurin"
          cache: "maven"
      
      - name: Start Backend Server
        run: |
          cd backend
          ./mvnw spring-boot:run -Dspring-boot.run.jvmArguments="-Dserver.port=9095" &
          echo $! > backend.pid
        env:
          SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/skillbridge_e2e
          SPRING_DATASOURCE_USERNAME: skillbridge
          SPRING_DATASOURCE_PASSWORD: e2e_password
      
      - name: Install dependencies
        run: npm ci
      
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
      
      - name: Start Frontend Dev Server
        run: |
          npm run dev &
          echo $! > frontend.pid
      
      - name: Wait for services
        run: |
          sleep 10
      
      - name: Run Playwright E2E tests
        run: npx playwright test
        env:
          PLAYWRIGHT_BASE_URL: http://localhost:3000
      
      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
