name: CI

on:
  push:
    branches: [main, frontend-prototype, dev]
  pull_request:
    branches: [main, frontend-prototype, dev]

jobs:
  backend:
    name: Build & Verify Backend
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: skillbridge
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: jdbc:postgresql://localhost:5432/skillbridge?sslmode=disable
      DATABASE_USERNAME: postgres
      DATABASE_PASSWORD: postgres
      FLYWAY_ENABLED: "true"
      JWT_SECRET: very_secret_default_key_that_should_be_changed_in_prod_and_is_at_least_256_bits_long
      SERVER_PORT: 9095

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Make Maven Wrapper executable
        shell: bash
        run: chmod +x backend/mvnw

      - name: Run Backend Test Suite
        shell: bash
        run: cd backend && ./mvnw -B test

      - name: Package Backend Artifact
        shell: bash
        run: cd backend && ./mvnw -B package -DskipTests

  frontend:
    name: Build & Verify Frontend
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [20.x]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Check TypeScript types
        run: npx tsc --noEmit

      - name: Build Frontend project
        run: npm run build
        env:
          VITE_API_BASE_URL: http://localhost:9095
