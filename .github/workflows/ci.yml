name: CI

on:
  push:
  pull_request:

jobs:
  build:
    name: Compile backend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Compile with Maven Wrapper
        shell: bash
        run: ./mvnw -B compile
